name: Build and Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          RAW=$(head -n 1 VERSION.md | tr -d '\r')
          VERSION="${RAW#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version in VERSION.md first line: $RAW"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Build
        run: python build.py

      - name: Verify artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -f "dist/Expreload_v${VERSION}/Expreload.exe"
          test -d "dist/Expreload_v${VERSION}/lib"
          test -f "dist/Expreload_v${VERSION}.zip"
          ls -lh dist

      - name: Generate release body
        shell: bash
        run: |
          set -euo pipefail
          VERSION_LINE=$(head -n 1 VERSION.md | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          {
            echo "## ${VERSION_LINE}"
            echo
            tail -n +2 VERSION.md | tr -d '\r'
          } > release-body.md
          echo "--- release body ---"
          cat release-body.md
          echo "--------------------"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release-body.md
          fail_on_unmatched_files: true
          files: |
            dist/Expreload_v${{ steps.version.outputs.version }}.zip
